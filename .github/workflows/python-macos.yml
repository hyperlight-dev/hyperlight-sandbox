name: macOS Python wheels

on:
  workflow_call:

permissions:
  contents: read

jobs:
  wheels:
    name: Python wheels (macOS arm64)
    timeout-minutes: ${{ fromJSON(vars.BUILD_TEST_JOB_TIMEOUT || '45') }}
    runs-on: [self-hosted, macos, arm64, hvf]
    env:
      HYPERLIGHT_GUEST_ARTIFACT: "0"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = "arm64"
      - name: Hyperlight setup
        uses: hyperlight-dev/ci-setup-workflow@59673866360458f8dd035f4a9fa766aeebad2038  # v2.3.1
        with:
          just-version: 1.59.0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: src/wasm_sandbox/guests/javascript/package-lock.json
      - name: Install Python
        run: uv python install 3.10 3.11 3.12 3.13 3.14 3.15
      - name: Install LLVM
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_UPGRADE: "1"
        run: |
          brew install llvm
          llvm_bin="$(brew --prefix llvm)/bin"
          "$llvm_bin/clang" --version
          echo "$llvm_bin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - name: Build native backend and guest wheels
        run: |
          export INTERPRETERS="--interpreter $(uv python find 3.10) $(uv python find 3.11) $(uv python find 3.12) $(uv python find 3.13) $(uv python find 3.14) $(uv python find 3.15)"
          just python-dist
      - name: Test installed wheels
        run: just python python-wheelhouse-test-all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python-wheels-macos
          path: |
            dist/pythonsdk/wasm_backend/
            dist/pythonsdk/hyperlight_js_backend/
            dist/pythonsdk/python_guest/
            dist/pythonsdk/javascript_guest/
          if-no-files-found: error
