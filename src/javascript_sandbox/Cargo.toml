[package]
name = "hyperlight-javascript-sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Hyperlight JS guest for hyperlight-sandbox"

[dependencies]
hyperlight-sandbox.workspace = true
anyhow = "1"
url = "2"
# The published 0.4.0 release still uses Hyperlight 0.17, which cannot coexist with 0.18.
hyperlight-js = { git = "https://github.com/hyperlight-dev/hyperlight-js", rev = "86756d2ffe56307d9a4ca4efe233d0332fd3aceb" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
