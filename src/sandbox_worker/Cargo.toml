[package]
name = "hyperlight-sandbox-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Experimental developer-only sandbox worker for the SDKs."

[dependencies]
anyhow = "1"
hyperlight-sandbox = { workspace = true }
hyperlight-sandbox-wasm = { workspace = true }
hyperlight-sandbox-javascript = { workspace = true }
hyperlight-wasm = { workspace = true }
hyperlight-js = "0.5.0"
libc = "0.2"
log = "0.4"
postcard = { version = "1", features = ["alloc", "use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
sha2 = "0.10"
